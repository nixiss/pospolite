<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pospolite</title>
    <style>
        /* Убираем отступы у страницы */
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Темный фон */
            height: 100vh; /* Высота на весь экран */
            display: flex; /* Включаем гибкую верстку */
            justify-content: center; /* Центрируем по горизонтали */
            align-items: center; /* Центрируем по вертикали */
            font-family: 'Arial', sans-serif; /* Шрифт без засечек */
        }

        /* Стиль для самого текста */
        .brand-name {
            color: #ffffff; /* Белый цвет текста */
            font-size: 5rem; /* Очень крупный размер шрифта */
            font-weight: bold; /* Жирный шрифт */
            text-transform: lowercase; /* Все буквы строчные (маленькие) */
            letter-spacing: 5px; /* Расстояние между буквами */
            
            /* Добавляем неоновое свечение (опционально) */
            text-shadow: 0 0 10px #00d4ff, 
                         0 0 20px #00d4ff;
        }
    </style>
</head>
<body>

    <!-- Само слово -->
    <div class="brand-name">pospolite</div>

</body>
</html>
